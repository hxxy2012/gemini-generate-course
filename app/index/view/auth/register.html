<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - CourseGenius</title>
    <link rel="stylesheet" href="https://cdn.staticfile.org/layui/2.8.18/css/layui.css">
    <link rel="stylesheet" href="https://cdn.staticfile.org/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px 0;
        }
        .register-container {
            width: 450px;
            background: white;
            border-radius: 10px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0,0,0,.2);
        }
        .register-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .register-header h1 {
            font-size: 28px;
            color: #333;
            margin-bottom: 10px;
        }
        .register-header p {
            color: #999;
            font-size: 14px;
        }
        .register-logo {
            font-size: 48px;
            color: #009688;
            margin-bottom: 15px;
        }
        .layui-form-item {
            margin-bottom: 20px;
        }
        .layui-input {
            height: 45px;
            line-height: 45px;
            padding-left: 15px;
        }
        .register-btn {
            width: 100%;
            height: 45px;
            line-height: 45px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            font-size: 16px;
        }
        .register-footer {
            text-align: center;
            margin-top: 20px;
        }
        .register-footer a {
            color: #009688;
            text-decoration: none;
        }
        .register-footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="register-container">
        <div class="register-header">
            <div class="register-logo">
                <i class="fa-solid fa-graduation-cap"></i>
            </div>
            <h1>注册账号</h1>
            <p>加入CourseGenius，开启AI课程创作之旅</p>
        </div>

        <form class="layui-form" lay-filter="register-form">
            <div class="layui-form-item">
                <input type="text" name="username" lay-verify="required|username" placeholder="用户名（3-50字符）" autocomplete="off" class="layui-input">
            </div>
            <div class="layui-form-item">
                <input type="text" name="email" lay-verify="required|email" placeholder="邮箱" autocomplete="off" class="layui-input">
            </div>
            <div class="layui-form-item">
                <input type="password" name="password" lay-verify="required|password" placeholder="密码（6-20字符）" autocomplete="off" class="layui-input">
            </div>
            <div class="layui-form-item">
                <input type="password" name="password_confirm" lay-verify="required|confirmPassword" placeholder="确认密码" autocomplete="off" class="layui-input">
            </div>
            <div class="layui-form-item">
                <button class="layui-btn register-btn" lay-submit lay-filter="register-submit">
                    <i class="fa-solid fa-user-plus"></i> 立即注册
                </button>
            </div>
        </form>

        <div class="register-footer">
            <p>已有账号？ <a href="/login">立即登录</a></p>
        </div>
    </div>

    <script src="https://cdn.staticfile.org/layui/2.8.18/layui.js"></script>
    <script src="https://cdn.staticfile.org/jquery/3.6.0/jquery.min.js"></script>
    <script>
        layui.use(['form', 'layer'], function(){
            var form = layui.form;
            var layer = layui.layer;

            // 自定义验证规则
            form.verify({
                username: function(value){
                    if(value.length < 3 || value.length > 50){
                        return '用户名长度必须在3-50个字符之间';
                    }
                    if(!/^[a-zA-Z0-9_-]+$/.test(value)){
                        return '用户名只能包含字母、数字、下划线和破折号';
                    }
                },
                password: function(value){
                    if(value.length < 6 || value.length > 20){
                        return '密码长度必须在6-20个字符之间';
                    }
                },
                confirmPassword: function(value){
                    if(value !== $('input[name="password"]').val()){
                        return '两次密码输入不一致';
                    }
                }
            });

            // 监听提交
            form.on('submit(register-submit)', function(data){
                var loadIndex = layer.load(1, {shade: 0.3});

                $.ajax({
                    url: '/register',
                    type: 'POST',
                    data: data.field,
                    dataType: 'json',
                    success: function(res) {
                        layer.close(loadIndex);
                        if (res.code === 1) {
                            layer.msg('注册成功，正在跳转登录...', {icon: 1}, function() {
                                location.href = '/login';
                            });
                        } else {
                            layer.msg(res.message, {icon: 2});
                        }
                    },
                    error: function() {
                        layer.close(loadIndex);
                        layer.msg('注册失败，请稍后重试', {icon: 2});
                    }
                });

                return false;
            });
        });
    </script>
</body>
</html>
